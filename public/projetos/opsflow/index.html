<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>OpsFlow · Console de workflow e aprovações</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="OpsFlow: console de workflow e aprovações com RBAC, SLA e trilha de auditoria (demo com dados fictícios).">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Aplica o tema antes do primeiro paint para evitar o flash claro/escuro.
    try {
      var stored = localStorage.getItem('opsflow.theme');
      var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {
      /* sem storage: o app define o tema ao iniciar */
    }
  </script>
<link rel="stylesheet" href="styles-UDZJHEVV.css"><link rel="stylesheet" href="theme-light-KDFKAH7Z.css"></head>
<body>
  <script>
    // Tema escuro: baixa a folha escura (depois da clara, para sobrepô-la) antes do primeiro paint.
    try {
      if (document.documentElement.dataset.theme === 'dark') {
        var dark = document.createElement('link');
        dark.id = 'ox-theme-dark';
        dark.rel = 'stylesheet';
        dark.href = 'theme-dark.css';
        document.head.appendChild(dark);
      }
    } catch (e) {
      /* sem DOM: o app ajusta ao iniciar */
    }
  </script>
  <app-root></app-root>
<script src="main-IIQF3DAE.js" type="module"></script></body>
</html>
