<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>OpsFlow · Console de workflow e aprovações</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="OpsFlow: console de workflow e aprovações com RBAC, SLA e trilha de auditoria (demo com dados fictícios).">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0d0f12">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // O OpsFlow é escuro por padrão. Aplica o tema salvo antes do primeiro paint (sem flash).
    try {
      var stored = localStorage.getItem('opsflow.theme');
      document.documentElement.dataset.theme = stored === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
<link rel="stylesheet" href="styles-2KQFRDPS.css"><link rel="stylesheet" href="theme-dark-HZUAWSDT.css"></head>
<body>
  <script>
    // Tema claro: baixa a folha clara (depois da escura, para sobrepô-la) antes do primeiro paint.
    try {
      if (document.documentElement.dataset.theme === 'light') {
        var light = document.createElement('link');
        light.id = 'ox-theme-light';
        light.rel = 'stylesheet';
        light.href = 'theme-light.css';
        // Logo depois da folha escura do NG-ZORRO e antes dos estilos do app, que a ajustam.
        var base = document.querySelector('link[href*="theme-dark"]');
        if (base) base.after(light);
        else document.head.appendChild(light);
      }
    } catch (e) {
      /* sem DOM: o app ajusta ao iniciar */
    }
  </script>
  <app-root></app-root>
<script src="main-OG5JGKGE.js" type="module"></script></body>
</html>
