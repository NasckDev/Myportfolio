<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Nasck UI: design system React acessível, com 20 componentes, tokens, construtor de tema, modelos de telas e documentação viva de teclado e ARIA."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Apply the saved theme before first paint, so there is no flash of the wrong theme.
      try {
        var saved = localStorage.getItem('nasck-ui-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (error) {
        /* storage blocked: the system preference applies */
      }
    </script>
    <title>Nasck UI · Design system acessível</title>

    <link rel="stylesheet" crossorigin href="./assets/index-M_V-7de0.css">
  </head>

    <div id="root"></div>
  </body>
</html>
